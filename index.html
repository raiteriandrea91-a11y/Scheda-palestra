  { cat:'Costanza', ic:'🌱', nm:'Prima settimana attiva', check:s=>activeWeeksSet(s).size>=1 },
  { cat:'Costanza', ic:'🔥', nm:'3 settimane di fila', check:s=>currentStreak(s)>=3 },
  { cat:'Costanza', ic:'🚀', nm:'6 settimane di fila', check:s=>currentStreak(s)>=6 },
  { cat:'Costanza', ic:'🦾', nm:'10 settimane di fila', check:s=>currentStreak(s)>=10 },
  { cat:'Costanza', ic:'👑', nm:'12 settimane di fila', check:s=>currentStreak(s)>=12 },
  { cat:'Costanza', ic:'🏔️', nm:'20 settimane di fila', check:s=>currentStreak(s)>=20 },
  { cat:'Costanza', ic:'🎖️', nm:'52 settimane: un anno intero', check:s=>currentStreak(s)>=52 },
  { cat:'Costanza', ic:'📅', nm:'10 settimane attive totali', check:s=>activeWeeksSet(s).size>=10 },
  { cat:'Costanza', ic:'🗓️', nm:'25 settimane attive totali', check:s=>activeWeeksSet(s).size>=25 },

  { cat:'Forza', ic:'🏆', nm:'Primo record personale', check:s=>countPRs(s)>=1 },
  { cat:'Forza', ic:'💥', nm:'5 record personali', check:s=>countPRs(s)>=5 },
  { cat:'Forza', ic:'⚡', nm:'10 record personali', check:s=>countPRs(s)>=10 },
  { cat:'Forza', ic:'🌟', nm:'25 record personali', check:s=>countPRs(s)>=25 },
  { cat:'Forza', ic:'🏅', nm:'50 record personali', check:s=>countPRs(s)>=50 },
  { cat:'Forza', ic:'💎', nm:'75 record personali', check:s=>countPRs(s)>=75 },
  { cat:'Forza', ic:'👊', nm:'100 record personali', check:s=>countPRs(s)>=100 },

  { cat:'Tecnica', ic:'🎚️', nm:'Primo sforzo registrato', check:s=>rpeLoggedCount(s)>=1 },
  { cat:'Tecnica', ic:'📐', nm:'20 sforzi registrati', check:s=>rpeLoggedCount(s)>=20 },
  { cat:'Tecnica', ic:'📊', nm:'50 sforzi registrati', check:s=>rpeLoggedCount(s)>=50 },
  { cat:'Tecnica', ic:'🧠', nm:'100 sforzi registrati', check:s=>rpeLoggedCount(s)>=100 },
  { cat:'Tecnica', ic:'🥵', nm:'Sforzo massimo raggiunto (10)', check:s=>maxRpeEver(s)>=10 },
  { cat:'Tecnica', ic:'😌', nm:'Allenamento leggero registrato', check:s=>minRpeEver(s)<=2 },

  { cat:'Esplorazione', ic:'🛠️', nm:'Scheda personalizzata', check:s=>isCustomized(s) },
  { cat:'Esplorazione', ic:'✅', nm:'Petto & Tricipiti completato al 100%', check:s=>dayCompletedOnce(s,'d1') },
  { cat:'Esplorazione', ic:'✅', nm:'Dorso & Bicipiti completato al 100%', check:s=>dayCompletedOnce(s,'d2') },
  { cat:'Esplorazione', ic:'✅', nm:'Gambe & Spalle completato al 100%', check:s=>dayCompletedOnce(s,'d3') },
  { cat:'Esplorazione', ic:'✅', nm:'Total Body completato al 100%', check:s=>dayCompletedOnce(s,'d4') },
  { cat:'Esplorazione', ic:'🧭', nm:'Nuovo giorno creato', check:s=>s.days.length > SEED_DAYS.length },
  { cat:'Esplorazione', ic:'📋', nm:'Nuova scheda creata', check:s=>s.schede.length > SEED_SCHEDE.length },
  { cat:'Esplorazione', ic:'🧩', nm:"10 esercizi in più rispetto all'inizio", check:s=>(s.days.reduce((n,d)=>n+d.groups.reduce((m,g)=>m+g.items.length,0),0) - baseExerciseCount())>=10 },
  { cat:'Esplorazione', ic:'🏃', nm:'Esercizio cardio personalizzato', check:s=>{
      const live = s.days.reduce((n,d)=>n+d.groups.reduce((m,g)=>m+g.items.filter(it=>it.type==='cardio').length,0),0);
      return live > baseGroupCounts().cardio;
    } },
  { cat:'Esplorazione', ic:'⛰️', nm:'Esercizio piramidale creato', check:s=>{
      const live = s.days.reduce((n,d)=>n+d.groups.filter(g=>g.pyramid).length,0);
      return live > baseGroupCounts().pyramid;
    } },
  { cat:'Esplorazione', ic:'📝', nm:'Prima nota salvata', check:s=>noteCount(s)>=1 },
  { cat:'Esplorazione', ic:'🗒️', nm:'5 note salvate', check:s=>noteCount(s)>=5 },
];

function renderBadges(container, s){
  container.innerHTML='';
  const cats = [...new Set(BADGES.map(b=>b.cat))];
  cats.forEach(cat=>{
    const title=document.createElement('div');
    title.className='section-title'; title.style.padding='14px 0 8px'; title.textContent=cat;
    container.appendChild(title);
    const grid=document.createElement('div');
    grid.className='badges';
    BADGES.filter(b=>b.cat===cat).forEach(b=>{
      const unlocked=b.check(s);
      const el=document.createElement('div');
      el.className='badge'+(unlocked?' unlocked':'');
      el.innerHTML=`<div class="ic">${b.ic}</div><div class="nm">${b.nm}</div>`;
      grid.appendChild(el);
    });
    container.appendChild(grid);
  });
}

/* =========================================================
   RENDER — STATISTICHE
   ========================================================= */
function renderStats(){
  const s=state;
  const streak = currentStreak(s);
  const weeksActive = activeWeeksSet(s).size;
  const prs = countPRs(s);
  const improved = mostImprovedExercise(s);

  const view=document.getElementById('statsView');
  view.innerHTML = `
    <div class="stats-grid">
      <div class="stat-card"><div class="val">${streak}</div><div class="lbl">Settimane di fila</div></div>
      <div class="stat-card"><div class="val">${weeksActive}/${s.weeksCount}</div><div class="lbl">Settimane attive</div></div>
      <div class="stat-card"><div class="val">${prs}</div><div class="lbl">Record personali totali</div></div>
      <div class="stat-card"><div class="val">${s.days.reduce((n,d)=>n+d.groups.reduce((m,g)=>m+g.items.length,0),0)}</div><div class="lbl">Esercizi in scheda</div></div>
      ${improved ? `<div class="stat-card wide"><div class="val" style="font-size:18px;">${improved.name}</div><div class="lbl">Esercizio più migliorato: ${fmt(improved.first)}kg → ${fmt(improved.last)}kg (${fmtPct(improved.pct)})</div></div>` : ''}
    </div>

    <div class="section-title" style="padding-bottom:0;">Obiettivi sbloccati</div>
    <div id="badgesContainer"></div>
    <div style="height:20px;"></div>
  `;

  renderBadges(document.getElementById('badgesContainer'), s);
}

/* =========================================================
   MASTER RENDER
   ========================================================= */
function renderAll(){
  ensureCurrentDayValid();
  renderTheme(currentSchedaObj());
  document.getElementById('editToggle').classList.toggle('on', editMode);
  renderHeaderSwipe();

  if(currentView==='train'){
    document.getElementById('trainView').style.display='block';
    document.getElementById('statsView').style.display='none';
    document.getElementById('navTrain').classList.add('active');
    document.getElementById('navStats').classList.remove('active');
    renderDayTabs(); renderWeekStrip(); renderExercises();
  } else {
    document.getElementById('trainView').style.display='none';
    document.getElementById('statsView').style.display='block';
    document.getElementById('navTrain').classList.remove('active');
    document.getElementById('navStats').classList.add('active');
    renderStats();
  }
}

/* =========================================================
   EVENTI GLOBALI
   ========================================================= */
document.getElementById('editToggle').addEventListener('click', ()=>{
  editMode=!editMode;
  showToast(editMode ? 'Modalità modifica attiva' : 'Modalità modifica disattivata');
  renderAll();
});
document.getElementById('navTrain').addEventListener('click', ()=>{ currentView='train'; renderAll(); });
document.getElementById('navStats').addEventListener('click', ()=>{ currentView='stats'; renderAll(); });

document.getElementById('exportBtn').addEventListener('click', ()=>{
  const blob=new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='scheda-palestra-backup.json'; a.click();
  URL.revokeObjectURL(url);
});
document.getElementById('importBtn').addEventListener('click', ()=>document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', e=>{
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=evt=>{
    try{
      const data=JSON.parse(evt.target.result);
      state=mergeLoadedState(data);
      editMode=false; currentView='train';
      saveState(); renderAll();
      showToast('Backup importato ✔');
    }catch(err){ alert('File non valido.'); }
  };
  reader.readAsText(file);
});
document.getElementById('resetBtn').addEventListener('click', ()=>{
  const day = currentDayObj();
  if(!day){ showToast('Nessun giorno selezionato'); return; }
  const meta = effectiveDayMeta(day, state.currentWeek);
  const ids = day.groups.flatMap(g=>g.items.map(it=>it.id));
  const hasWeights = ids.some(id=>state.weights[id] && Object.keys(state.weights[id]).length>0);
  const hasRpe = ids.some(id=>state.rpe[id] && Object.keys(state.rpe[id]).length>0);
  if(!hasWeights && !hasRpe){ showToast('Nessun peso o sforzo registrato per questo giorno'); return; }
  if(confirm(`Cancellare tutti i pesi e gli sforzi registrati per "${meta.focus}" (tutte le settimane)? Esercizi, altri giorni e altre schede non verranno toccati.`)){
    ids.forEach(id=>{ delete state.weights[id]; delete state.rpe[id]; });
    saveState(); renderAll();
    showToast('Pesi e sforzi del giorno azzerati');
  }
});

/* =========================================================
   AVVIO
   ========================================================= */
renderAll();
