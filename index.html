<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Scheda Palestra</title>

<!-- PWA: rende l'app installabile sulla schermata home del telefono -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B8E56">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Le tue schede di allenamento, pesi, sforzo e progressi settimana dopo settimana.">

<!-- iOS: comportamento a schermo intero da schermata home -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Palestra">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<!-- Icone / favicon -->
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="shortcut icon" href="favicon.ico">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EEF1F5;
    --bg-elev: #F1F3F7;
    --card: #FFFFFF;
    --card-hi: #FFFFFF;
    --card-border: #E6E9EE;
    --ink: #1B1D21;
    --ink-dim: #6B7076;
    --ink-faint: #9BA1A8;
    --gold: #E8A93B;
    --green: #2FAE60;
    --red: #E3483D;

    --day1: #EE5A45; --day1-soft: rgba(238,90,69,0.12);
    --day2: #1A73E8; --day2-soft: rgba(26,115,232,0.10);
    --day3: #E0A93E; --day3-soft: rgba(224,169,62,0.13);
    --day4: #8C5CE0; --day4-soft: rgba(140,92,224,0.11);
    --day5: #23A566; --day5-soft: rgba(35,165,102,0.11);
    --day6: #E0609E; --day6-soft: rgba(224,96,158,0.11);

    --accent: var(--day1);
    --accent-soft: var(--day1-soft);
    --radius: 20px;
    --shadow-sm: 0 1px 2px rgba(30,32,38,.05), 0 2px 8px rgba(30,32,38,.05);
    --shadow-md: 0 4px 16px rgba(30,32,38,.08);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:calc(80px + var(--safe-b));
    overflow-x:hidden;
    width:100%;
  }
  h1,h2,h3{font-family:'Rubik',sans-serif; font-weight:600; letter-spacing:0; margin:0;}
  button{font-family:inherit;}
  input,textarea{font-family:inherit;}

  /* ---------- Header con swipe schede ---------- */
  header{padding:22px 0 4px; position:relative; overflow:hidden; background:var(--bg); box-shadow:0 1px 0 var(--card-border);}
  header::before{
    content:""; position:absolute; top:-70px; right:-60px; width:220px; height:220px;
    border-radius:50%; background:var(--accent); opacity:0.13; transition:background .35s ease; pointer-events:none;
  }
  #editToggle{position:absolute; top:22px; right:18px; z-index:3;}
  .icon-btn{
    flex:0 0 auto; width:42px; height:42px; border-radius:14px;
    border:none; background:var(--card); color:var(--ink-dim); box-shadow:var(--shadow-sm);
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:17px; transition:.15s;
  }
  .icon-btn.on{background:var(--accent); color:#fff; box-shadow:var(--shadow-md);}

  .header-swipe{display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; cursor:grab; user-select:none;}
  .header-swipe::-webkit-scrollbar{display:none;}
  .header-swipe.dragging{cursor:grabbing; scroll-snap-type:none;}
  .header-page{flex:0 0 100%; scroll-snap-align:start; padding:0 18px 6px; padding-right:64px;}
  .header-page .eyebrow{font-size:12px; color:var(--ink-dim); margin-bottom:4px;}
  .header-page h1{font-size:24px; line-height:1.1; font-weight:600;}
  .scheda-dots{display:flex; justify-content:center; gap:6px; padding-bottom:6px; opacity:0; transition:opacity .25s ease;}
  .scheda-dots.visible{opacity:1;}
  .scheda-dot{width:6px; height:6px; border-radius:50%; background:var(--card-border); transition:background .2s;}
  .scheda-dot.active{background:var(--ink-dim);}
  #manageSchedeLink{text-align:center; font-size:12.5px; font-weight:600; color:var(--accent); padding:0 0 10px; cursor:pointer;}

  /* ---------- Day tabs ---------- */
  .day-tabs{display:flex; gap:9px; padding:14px 16px 0; overflow-x:auto; scrollbar-width:none;}
  .day-tabs::-webkit-scrollbar{display:none;}
  .day-tab{
    flex:0 0 auto; position:relative; display:flex; flex-direction:column; align-items:flex-start; gap:2px;
    padding:10px 15px; border-radius:16px; border:none; background:var(--card); box-shadow:var(--shadow-sm);
    cursor:pointer; user-select:none; transition:box-shadow .2s, background .2s; min-width:108px;
  }
  .day-tab .num{font-family:'Rubik',sans-serif; font-size:11px; color:var(--ink-faint); letter-spacing:.04em; font-weight:500;}
  .day-tab .foc{font-size:13px; font-weight:600; color:var(--ink-dim);}
  .day-tab.active{background:var(--accent); box-shadow:var(--shadow-md);}
  .day-tab.active .num{color:rgba(255,255,255,.75);}
  .day-tab.active .foc{color:#fff;}
  .day-tab.add{align-items:center; justify-content:center; min-width:46px; color:var(--accent); border:1.5px dashed var(--card-border); background:transparent; box-shadow:none; font-size:18px;}
  .day-tab .del-day{
    position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%;
    background:var(--red); color:#fff; font-size:12px; display:flex; align-items:center; justify-content:center;
    border:2px solid var(--bg); cursor:pointer;
  }
  .day-tab .edit-day{
    position:absolute; top:-6px; left:-6px; width:20px; height:20px; border-radius:50%;
    background:var(--card); color:var(--ink-dim); font-size:10.5px; display:flex; align-items:center; justify-content:center;
    border:2px solid var(--bg); box-shadow:var(--shadow-sm); cursor:pointer;
  }

  /* ---------- Week strip ---------- */
  .week-strip{
    display:flex; align-items:center; gap:8px; padding:14px 16px;
    overflow-x:auto; scrollbar-width:none; position:sticky; top:0; background:var(--bg); z-index:5;
  }
  .week-strip::-webkit-scrollbar{display:none;}
  .week-label{font-size:11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.06em; flex:0 0 auto; margin-right:2px;}
  .week-pill-wrap{position:relative; flex:0 0 auto;}
  .week-pill{
    padding:9px 16px; border-radius:20px; border:none;
    background:var(--card); box-shadow:var(--shadow-sm); color:var(--ink-dim); font-size:14px; font-weight:600; cursor:pointer; transition:.2s;
  }
  .week-pill.active{background:var(--accent); color:#fff; box-shadow:var(--shadow-md);}
  .week-pill.add{color:var(--accent); border:1.5px dashed var(--card-border); background:transparent; box-shadow:none;}
  .week-pill-wrap .del-week{
    position:absolute; top:-6px; right:-6px; width:18px; height:18px; border-radius:50%;
    background:var(--red); color:#fff; font-size:11px; display:flex; align-items:center; justify-content:center;
    border:2px solid var(--bg); cursor:pointer;
  }

  /* ---------- Progress ---------- */

  /* ---------- Day description ---------- */
  .day-desc{
    margin:14px 16px 0; padding:13px 15px; border-radius:16px;
    background:var(--accent-soft); border:none;
    font-size:12.5px; line-height:1.5; color:var(--ink-dim);
  }

  /* ---------- Groups & exercises ---------- */
  main{padding:6px 16px 20px;}
  .group{margin-top:22px; position:relative;}
  .group-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:9px; flex-wrap:wrap;}
  .group-title{
    display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; color:var(--accent);
    background:var(--accent-soft); border-radius:8px; padding:5px 10px;
  }
  .group-edit-row{display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
  .mini-btn{
    border:1.5px dashed var(--card-border); background:transparent; color:var(--ink-faint);
    border-radius:10px; font-size:12px; padding:7px 11px; cursor:pointer;
  }
  .mini-btn.danger{color:var(--red); border-color:rgba(227,72,61,.35);}
  .add-ex-btn{
    width:36px; height:36px; border-radius:50%; border:1.5px dashed var(--card-border);
    background:transparent; color:var(--ink-faint); display:flex; align-items:center; justify-content:center;
    font-size:18px; cursor:pointer; margin-top:2px;
  }
  .new-group-btn{
    display:block; width:100%; margin-top:20px; text-align:center;
    border:1.5px dashed var(--card-border); background:transparent; color:var(--accent);
    border-radius:14px; font-size:14px; font-weight:600; padding:13px 0; cursor:pointer;
  }

  .pyramid-card{background:var(--card); border:none; box-shadow:var(--shadow-sm); border-radius:var(--radius); padding:16px; margin-bottom:10px;}
  .pyramid-card .ex-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px;}
  .ex-name{font-size:15px; font-weight:600; color:var(--ink);}
  .ex-scheme{font-size:12.5px; color:var(--ink-dim); margin-top:3px;}
  .pyramid-detail{margin-top:10px; font-size:11.5px; color:var(--ink-faint); border-top:1px dashed var(--card-border); padding-top:10px; line-height:1.6;}

  .ex-card{
    display:flex; flex-direction:column; gap:2px; background:var(--card); border:none; box-shadow:var(--shadow-sm);
    border-left:4px solid transparent; border-radius:18px; padding:14px 15px; margin-bottom:9px;
  }
  .ex-main{display:flex; align-items:center; gap:10px;}
  .ex-card.pr-flash{animation:prflash 1.1s ease;}
  @keyframes prflash{
    0%{box-shadow:0 0 0 0 rgba(232,169,59,.55);}
    100%{box-shadow:0 0 0 14px rgba(232,169,59,0);}
  }
  .ex-card.choice{border-left-color:var(--accent);}
  .ex-info{flex:1; min-width:0;}
  .ex-name-row{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .trophy{font-size:13px;}
  .chip-row{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;}
  .hist-chip{font-size:10.5px; color:var(--ink-dim); background:var(--bg-elev); border-radius:7px; padding:4px 8px; white-space:nowrap;}
  .hist-chip.clickable{cursor:pointer;}
  .hist-chip.sugg{background:var(--accent-soft); color:var(--accent); font-weight:600;}
  .ex-note-toggle{font-size:11.5px; color:var(--ink-faint); cursor:pointer; margin-top:7px; display:inline-block; text-decoration:underline dotted; padding:2px 0;}
  .ex-note-box{margin-top:6px;}
  .ex-note-box textarea{
    width:100%; min-height:50px; resize:vertical; background:var(--bg-elev); border:none;
    border-radius:12px; color:var(--ink); font-size:13px; padding:9px 11px; outline:none;
  }
  .ex-name.editable{cursor:pointer; text-decoration:underline dotted;}

  .weight-col{flex:0 0 auto; display:flex; flex-direction:column; align-items:flex-end; gap:4px;}
  .weight-field{display:flex; align-items:center; gap:4px; background:var(--bg-elev); border:none; border-radius:14px; padding:9px 12px;}
  .weight-field input{
    width:56px; background:transparent; border:none; color:var(--ink); font-family:'Rubik',sans-serif;
    font-size:18px; font-weight:600; text-align:right; outline:none;
  }
  .weight-field input::placeholder{color:var(--ink-faint); font-weight:500;}
  .weight-field span{font-size:12px; color:var(--ink-faint);}
  .delta-row{display:flex; gap:5px; font-size:10.5px; font-weight:700;}
  .delta.up, .pct.up{color:var(--green);}
  .delta.down, .pct.down{color:var(--red);}

  .rpe-row{margin-top:12px; padding-top:12px; border-top:1px dashed var(--card-border);}
  .rpe-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .rpe-label{font-size:10.5px; color:var(--ink-faint); font-weight:700; letter-spacing:.05em; text-transform:uppercase;}
  .rpe-value{font-size:12px; font-weight:700; color:var(--ink);}
  .rpe-row.inactive .rpe-value{color:var(--ink-faint); font-weight:600;}
  .rpe-bars{display:flex; align-items:flex-end; justify-content:space-between; height:28px; padding:2px 0; cursor:pointer; touch-action:none; -webkit-user-select:none; user-select:none;}
  .rpe-bar{width:3px; border-radius:2px 2px 1px 1px; background:var(--card-border); transition:background .12s ease;}

  .edit-row{display:flex; gap:6px; margin-top:9px; flex-wrap:wrap; align-items:center;}
  .edit-row .reorder-btn{
    width:30px; height:30px; border-radius:8px; border:1.5px dashed var(--card-border);
    background:transparent; color:var(--ink-faint); font-size:13px; cursor:pointer;
  }
  .edit-row .reorder-btn:disabled{opacity:.25;}

  .drag-handle{
    width:34px; height:30px; border-radius:9px; border:1.5px dashed var(--card-border);
    background:transparent; color:var(--ink-faint); font-size:15px; cursor:grab;
    display:flex; align-items:center; justify-content:center; touch-action:none; flex:0 0 auto;
  }
  .drag-handle:active{cursor:grabbing;}
  .dragging-item{position:fixed; z-index:500; pointer-events:none; box-shadow:0 10px 28px rgba(20,22,28,.28); opacity:.97;}
  .drag-placeholder{border-radius:var(--radius); background:var(--accent-soft); border:2px dashed var(--accent); margin-bottom:9px;}
  main > .drag-placeholder{margin-top:22px; margin-bottom:0;}
  body.dragging-active{cursor:grabbing; -webkit-user-select:none; user-select:none;}

  .empty-state{padding:36px 10px; text-align:center; color:var(--ink-faint); font-size:13.5px;}

  /* ---------- Footer ---------- */
  footer{padding:22px 16px 26px; display:flex; gap:10px; flex-wrap:wrap; margin-top:16px;}
  .ghost-btn{font-size:12.5px; font-weight:600; color:var(--ink-dim); background:var(--card); border:none; box-shadow:var(--shadow-sm); border-radius:12px; padding:10px 14px; cursor:pointer;}
  .foot-note{width:100%; font-size:11.5px; color:var(--ink-faint); margin-top:2px;}
  #importFile{display:none;}

  /* ---------- Stats view ---------- */
  .stats-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:16px 16px 0;}
  .stat-card{background:var(--card); border:none; box-shadow:var(--shadow-sm); border-radius:var(--radius); padding:15px;}
  .stat-card .val{font-family:'Rubik',sans-serif; font-size:24px; font-weight:700; color:var(--accent);}
  .stat-card .lbl{font-size:11px; color:var(--ink-dim); margin-top:2px;}
  .stat-card.wide{grid-column:1 / -1;}
  .section-title{padding:20px 20px 8px; font-size:12.5px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.06em; font-weight:600;}
  .badges{display:grid; grid-template-columns:repeat(2, 1fr); gap:14px; padding:0 20px 4px;}
  .badge{background:var(--card); border:none; box-shadow:var(--shadow-sm); border-radius:18px; padding:20px 14px; text-align:center; opacity:.35; filter:grayscale(1); transition:opacity .2s ease, filter .2s ease;}
  .badge.unlocked{opacity:1; filter:none; box-shadow:0 0 0 2px var(--accent), var(--shadow-sm);}
  .badge .ic{font-size:30px;}
  .badge .nm{font-size:11.5px; color:var(--ink-dim); margin-top:8px; line-height:1.35; font-weight:500;}

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(20,22,28,.55); display:flex; align-items:flex-end; justify-content:center;
    z-index:100; opacity:0; pointer-events:none; transition:opacity .18s ease;
  }
  .overlay.show{opacity:1; pointer-events:auto;}
  .modal{
    background:var(--card); border:none; box-shadow:0 -8px 30px rgba(20,22,28,.18); border-radius:26px 26px 0 0; width:100%;
    max-height:80vh; overflow-y:auto;
    padding:22px 18px calc(22px + var(--safe-b)); transform:translateY(16px); transition:transform .18s ease;
  }
  .overlay.show .modal{transform:translateY(0);}
  .modal h3{font-size:18px; margin-bottom:14px;}
  .modal label{display:block; font-size:12px; color:var(--ink-dim); margin:12px 0 5px;}
  .modal input{
    width:100%; background:var(--bg-elev); border:none; border-radius:13px;
    padding:13px 13px; color:var(--ink); font-size:16px; outline:none;
  }
  .modal input:focus{box-shadow:0 0 0 2px var(--accent);}
  .choice-row{display:flex; flex-wrap:wrap; gap:8px;}
  .choice-btn{
    flex:1 1 110px; padding:11px 8px; border-radius:12px; border:1.5px solid var(--card-border);
    background:var(--bg-elev); color:var(--ink-dim); font-size:13px; font-weight:600; cursor:pointer;
  }
  .choice-btn.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  .field-hidden{display:none !important;}

  .color-row{display:flex; flex-wrap:wrap; gap:11px; padding:2px 0 4px;}
  .color-swatch{
    width:36px; height:36px; border-radius:50%; border:3px solid transparent; cursor:pointer; padding:0;
    box-shadow:0 1px 3px rgba(20,22,28,.18); transition:transform .12s ease, box-shadow .15s ease;
  }
  .color-swatch:active{transform:scale(.92);}
  .color-swatch.active{border-color:var(--card); box-shadow:0 0 0 2.5px var(--ink), 0 1px 3px rgba(20,22,28,.18);}

  .stepper-row{display:flex; align-items:center; gap:10px; margin-top:9px; padding-top:9px; border-top:1px dashed var(--card-border);}
  .stepper-label{font-size:10.5px; color:var(--ink-faint); font-weight:700; flex:1; letter-spacing:.04em;}
  .stepper-btn{width:30px; height:30px; border-radius:9px; border:none; background:var(--bg-elev); color:var(--ink-dim); font-size:17px; font-weight:700; cursor:pointer; line-height:1;}
  .stepper-val{font-size:14px; font-weight:700; color:var(--ink); min-width:22px; text-align:center;}

  .serie-rows{margin-top:10px; padding-top:10px; border-top:1px dashed var(--card-border); display:flex; flex-direction:column; gap:7px;}
  .serie-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .serie-label{font-size:12px; color:var(--ink-dim); font-weight:600;}
  .weight-field.small{padding:6px 10px;}
  .weight-field.small input{width:48px; font-size:15px;}
  .add-serie-btn{
    align-self:flex-start; margin-top:2px; border:1.5px dashed var(--card-border); background:transparent;
    color:var(--accent); border-radius:10px; font-size:12px; font-weight:600; padding:6px 11px; cursor:pointer;
  }
  .modal .btn-row{display:flex; gap:10px; margin-top:20px;}
  .modal .btn-row button{flex:1; padding:13px 0; border-radius:14px; font-size:14.5px; font-weight:600; cursor:pointer; border:none;}
  .btn-cancel{background:var(--bg-elev); color:var(--ink-dim);}
  .btn-confirm{background:var(--accent); color:#fff;}

  /* ---------- Wizard nuovo esercizio ---------- */
  .wizard-head{display:flex; align-items:center; gap:11px; margin-bottom:6px;}
  .wizard-back{
    width:34px; height:34px; border-radius:11px; border:none; background:var(--bg-elev); color:var(--ink-dim);
    font-size:18px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex:0 0 auto; line-height:1;
  }
  .wizard-titles h3{margin-bottom:1px;}
  .wizard-crumb{font-size:11.5px; color:var(--accent); font-weight:700; letter-spacing:.02em;}
  .wizard-sub{font-size:12.5px; color:var(--ink-dim); margin:2px 0 4px;}
  .type-grid{display:flex; flex-direction:column; gap:10px; margin-top:14px;}
  .type-tile{
    display:flex; align-items:center; gap:14px; padding:14px 15px; border-radius:18px;
    border:1.5px solid var(--card-border); background:var(--bg-elev); cursor:pointer; text-align:left;
    transition:transform .12s ease, border-color .15s ease, background .15s ease; width:100%;
  }
  .type-tile:active{transform:scale(.98);}
  .type-tile:hover{border-color:var(--accent);}
  .type-tile .ic{
    width:44px; height:44px; border-radius:14px; background:var(--accent-soft); color:var(--accent);
    display:flex; align-items:center; justify-content:center; font-size:20px; flex:0 0 auto;
  }
  .type-tile .tt{flex:1; min-width:0;}
  .type-tile .tt .h{font-size:14.5px; font-weight:700; color:var(--ink); display:block;}
  .type-tile .tt .s{font-size:11.5px; color:var(--ink-faint); margin-top:2px; display:block; line-height:1.35;}
  .type-tile .arrow{color:var(--ink-faint); font-size:17px; flex:0 0 auto;}

  .wizard-hint{
    margin:14px 0 0; padding:11px 14px; border-radius:14px; background:var(--accent-soft);
    font-size:11.5px; line-height:1.5; color:var(--ink-dim);
  }

  .pyramid-steps{display:flex; flex-direction:column; gap:8px; margin-top:8px;}
  .pyramid-step{display:flex; align-items:center; gap:10px; background:var(--bg-elev); border-radius:14px; padding:8px 10px;}
  .pyramid-step .badge-num{
    width:26px; height:26px; border-radius:50%; background:var(--accent); color:#fff; font-size:11.5px;

  { id:'s1', name:'Total Body', color:'day5', dayIds:['d4'] },
  { id:'s2', name:'Scheda Split', color:'day2', dayIds:['d1','d2','d3'] }

const LEGACY_COLOR_HEX = { day1:'#EE5A45', day2:'#1A73E8', day3:'#E0A93E', day4:'#8C5CE0', day5:'#23A566', day6:'#E0609E' };
const COLOR_PALETTE = [
  '#EE5A45','#1A73E8','#E0A93E','#8C5CE0','#23A566','#E0609E',
  '#17A2B8','#F2545B','#6C63FF','#2EC4B6','#FF8C42','#B5838D',
  '#3D5A80','#9B5DE5','#06A77D','#C9184A'
];
function resolveSchedaHex(color){
  if(!color) return COLOR_PALETTE[0];
  if(color.startsWith('#')) return color;
  return LEGACY_COLOR_HEX[color] || COLOR_PALETTE[0];
}
function hexToRgba(hex, alpha){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g=parseInt(h.substring(2,4),16), b=parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}
function nextPaletteColor(){
  const used = state.schede.map(s=>resolveSchedaHex(s.color));
  const free = COLOR_PALETTE.find(c=>!used.includes(c));
  return free || COLOR_PALETTE[state.schede.length % COLOR_PALETTE.length];
}

/* =========================================================
   STATO
   ========================================================= */
const STORAGE_KEY = 'scheda-palestra-data-v4';
let editMode = false;
let currentView = 'train';

function defaultState(){
  const days = JSON.parse(JSON.stringify(SEED_DAYS));
  const schede = JSON.parse(JSON.stringify(SEED_SCHEDE));
  const weights = {};
  days.forEach(d => d.groups.forEach(g => g.items.forEach(it => {
    weights[it.id] = Object.assign({}, it.initW || {});
    delete it.initW;
  })));
  return { days, schede, currentScheda:schede[0].id, currentDay:'d4', currentWeek:1, weeksCount:8, weights, notes:{}, rpe:{}, bodyweight:{}, actualSets:{}, actualReps:{} };
}
function mergeLoadedState(saved){
  if(!saved || !saved.days) return defaultState();
  const merged = Object.assign({ currentDay:'d4', currentWeek:1, weeksCount:8, weights:{}, notes:{}, rpe:{}, bodyweight:{}, actualSets:{}, actualReps:{} }, saved);
  if(!merged.schede || !merged.schede.length){
    const existingDayIds = new Set(merged.days.map(d=>d.id));
    const schede = JSON.parse(JSON.stringify(SEED_SCHEDE)).map(s=>({...s, dayIds:s.dayIds.filter(id=>existingDayIds.has(id))}));
    const assigned = new Set(schede.flatMap(s=>s.dayIds));
    const leftover = merged.days.map(d=>d.id).filter(id=>!assigned.has(id));
    if(leftover.length) schede.push({ id:uid('s'), name:'Altri giorni', color:'day3', dayIds:leftover });
    merged.schede = schede.filter(s=>s.dayIds.length>0);
    if(!merged.schede.length) merged.schede = schede;
    merged.currentScheda = merged.schede[0].id;
  }
  if(!merged.currentScheda) merged.currentScheda = merged.schede[0].id;
  return merged;
}
function loadState(){
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem(STORAGE_KEY)); }catch(e){}
  return mergeLoadedState(saved);
}
let state = loadState();
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function uid(p){ return p + '_' + Math.random().toString(36).slice(2,8); }

/* =========================================================
   HELPERS DATI
   ========================================================= */
function currentSchedaObj(){ return state.schede.find(s=>s.id===state.currentScheda) || state.schede[0]; }
function effectiveDayIdsForWeek(scheda, week){
  if(scheda.weekDayIds && scheda.weekDayIds[week]) return scheda.weekDayIds[week].slice();
  return scheda.dayIds.slice();
}
function materializeWeekDayIds(scheda, week){
  if(!scheda.weekDayIds) scheda.weekDayIds = {};
  if(!scheda.weekDayIds[week]) scheda.weekDayIds[week] = effectiveDayIdsForWeek(scheda, week);
  return scheda.weekDayIds[week];
}
function effectiveDayMeta(day, week){
  const o = day.weekMeta && day.weekMeta[week];
  return o ? o : { num: day.num, focus: day.focus };
}
function materializeDayMeta(day, week){
  if(!day.weekMeta) day.weekMeta = {};
  if(!day.weekMeta[week]) day.weekMeta[week] = { num: day.num, focus: day.focus };
  return day.weekMeta[week];
}
function visibleDaysForCurrentScheda(){
  const s = currentSchedaObj();
  if(!s) return [];
  const ids = effectiveDayIdsForWeek(s, state.currentWeek);
  return ids.map(id => state.days.find(d=>d.id===id)).filter(Boolean);
}
function ensureCurrentDayValid(){
  const s = currentSchedaObj();
  if(!s){ state.currentDay = null; return; }
  const ids = effectiveDayIdsForWeek(s, state.currentWeek);
  if(!ids.length){ state.currentDay = null; return; }
  if(!ids.includes(state.currentDay)) state.currentDay = ids[0];
}
function currentDayObj(){ return state.days.find(d => d.id === state.currentDay) || null; }
function findExercise(exId){
  for(const d of state.days) for(const g of d.groups) for(const it of g.items) if(it.id===exId) return it;
  return null;
}
function allExerciseIds(){
  const ids=[]; state.days.forEach(d=>d.groups.forEach(g=>g.items.forEach(it=>ids.push(it.id)))); return ids;
}
function parseNum(str){
  if(str===undefined || str===null) return NaN;
  return parseFloat(String(str).replace(',', '.').trim());
}
function weekRepValue(v){
  if(v===undefined || v===null) return undefined;
  if(Array.isArray(v)){
    const nums = v.filter(n=>n!==undefined && n!==null);
    return nums.length ? Math.max(...nums) : undefined;
  }
  return v;
}
function getWeight(exId, week){ const w=state.weights[exId]; return w?w[String(week)]:undefined; }
function setWeightRaw(exId, week, rawValue){
  if(!state.weights[exId]) state.weights[exId]={};
  const n = parseNum(rawValue);
  if(rawValue==='' || rawValue===null || isNaN(n)) delete state.weights[exId][String(week)];
  else state.weights[exId][String(week)] = n;
  saveState();
}
function getSerieWeights(exId, week){
  const w=state.weights[exId]; if(!w) return undefined;
  const v=w[String(week)];
  return Array.isArray(v) ? v : undefined;
}
function lastSerieValueBefore(exId, week, idx){
  const w=state.weights[exId]; if(!w) return undefined;
  for(let i=week-1;i>=1;i--){
    const arr=w[String(i)];
    if(Array.isArray(arr) && arr[idx]!==undefined && arr[idx]!==null) return arr[idx];
  }
  return undefined;
}
function maxWeight(exId, excludeWeek){
  const w = state.weights[exId]; if(!w) return undefined;
  let max;
  Object.keys(w).forEach(wk=>{
    if(excludeWeek!==undefined && wk===String(excludeWeek)) return;
    const v = w[wk];
    if(Array.isArray(v)){
      v.forEach(n=>{ if(n!==undefined && n!==null && (max===undefined||n>max)) max=n; });
    } else if(v!==undefined && v!==null){
      if(max===undefined||v>max) max=v;
    }
  });
  return max;
}
function lastLoggedBefore(exId, week){
  const w=state.weights[exId]; if(!w) return undefined;
  for(let i=week-1;i>=1;i--){
    const v = weekRepValue(w[String(i)]);
    if(v!==undefined) return v;
  }
  return undefined;
}
function fmt(n){ if(n===undefined||n===null) return ''; return (Math.round(n*2)/2).toString().replace('.', ','); }
function fmtPct(p){ const s=(Math.round(p*10)/10); return (s>0?'+':'') + s.toString().replace('.', ',') + '%'; }

function recommendedIncrement(group){ return group && group.pyramid ? 5 : 2.5; }
function recommendedWeight(exId, week, group){
  const prev = lastLoggedBefore(exId, week);
  if(prev===undefined) return undefined;
  return prev + recommendedIncrement(group);
}

function rpeLabel(v){
  if(v===undefined) return '';
  if(v<=2) return 'Leggero';
  if(v<=4) return 'Moderato';
  if(v<=6) return 'Impegnativo';
  if(v<=7.5) return 'Duro';
  if(v<9.5) return 'Molto duro';
  return 'Cedimento';
}
const RPE_BAR_COUNT = 52;
function rpeGradientColor(t){
  const stops = [[118,181,143],[230,173,82],[217,105,95]];
  const seg = t<=0.5 ? 0 : 1;
  const lt = t<=0.5 ? t/0.5 : (t-0.5)/0.5;
  const a=stops[seg], b=stops[seg+1];
  const r=Math.round(a[0]+(b[0]-a[0])*lt), g=Math.round(a[1]+(b[1]-a[1])*lt), bl=Math.round(a[2]+(b[2]-a[2])*lt);
  return `rgb(${r},${g},${bl})`;
}
function buildRpeBarsHtml(value){
  const filledCount = value===undefined ? 0 : Math.max(1, Math.round(((value-1)/9)*RPE_BAR_COUNT));
  let html='';
  for(let i=0;i<RPE_BAR_COUNT;i++){
    const t = i/(RPE_BAR_COUNT-1);
    const h = Math.round(6 + 20*t);
    const filled = i < filledCount;
    const color = filled ? rpeGradientColor(t) : 'var(--card-border)';
    html += `<span class="rpe-bar" style="height:${h}px; background:${color};"></span>`;
  }
  return html;
}
function getRPE(exId, week){ const r=state.rpe[exId]; return r?r[String(week)]:undefined; }
function setRPE(exId, week, val){
  if(!state.rpe[exId]) state.rpe[exId]={};
  if(val===undefined || val===null || val==='') delete state.rpe[exId][String(week)];
  else state.rpe[exId][String(week)] = parseFloat(val);
  saveState();
}
function getActualSets(exId, week){ const m=state.actualSets[exId]; return m?m[String(week)]:undefined; }
function setActualSets(exId, week, val){ if(!state.actualSets[exId]) state.actualSets[exId]={}; state.actualSets[exId][String(week)]=val; saveState(); }
function getActualReps(exId, week){ const m=state.actualReps[exId]; return m?m[String(week)]:undefined; }
function setActualReps(exId, week, val){ if(!state.actualReps[exId]) state.actualReps[exId]={}; state.actualReps[exId][String(week)]=val; saveState(); }

function dayHasData(day){
  return day.groups.some(g => g.items.some(it => state.weights[it.id] && Object.keys(state.weights[it.id]).length>0));
}
function dayHasDataForWeek(day, week){
  const wk = String(week);
  return day.groups.some(g => g.items.some(it => state.weights[it.id] && state.weights[it.id][wk]!==undefined));
}
function schedaHasData(s){
  return s.dayIds.some(id=>{ const d=state.days.find(x=>x.id===id); return d && dayHasData(d); });
}
function weekHasData(weekNum){
  const wk = String(weekNum);
  return allExerciseIds().some(id => state.weights[id] && state.weights[id][wk]!==undefined);
}
function shiftMapDown(map, deletedWeek, weeksCount){
  if(!map) return;
  delete map[String(deletedWeek)];
  for(let wk=deletedWeek+1; wk<=weeksCount; wk++){
    const key=String(wk), prevKey=String(wk-1);
    if(map[key]!==undefined){ map[prevKey]=map[key]; delete map[key]; }
    else delete map[prevKey];
  }
}
function deleteWeek(weekNum){
  if(state.weeksCount<=1){ showToast('Deve rimanere almeno una settimana'); return; }
  allExerciseIds().forEach(id=>{
    shiftMapDown(state.weights[id], weekNum, state.weeksCount);
    shiftMapDown(state.notes[id], weekNum, state.weeksCount);
    shiftMapDown(state.rpe[id], weekNum, state.weeksCount);
    shiftMapDown(state.actualSets[id], weekNum, state.weeksCount);
    shiftMapDown(state.actualReps[id], weekNum, state.weeksCount);
  });
  state.schede.forEach(s=>{ if(s.weekDayIds) shiftMapDown(s.weekDayIds, weekNum, state.weeksCount); });
  state.days.forEach(d=>{ if(d.weekMeta) shiftMapDown(d.weekMeta, weekNum, state.weeksCount); });
  state.weeksCount -= 1;
  if(state.currentWeek > weekNum) state.currentWeek -= 1;
  if(state.currentWeek > state.weeksCount) state.currentWeek = state.weeksCount;
  if(state.currentWeek < 1) state.currentWeek = 1;
  saveState();
}
function reorderGroupItems(group, orderedIds){
  const map={}; group.items.forEach(it=>map[it.id]=it);
  const next = orderedIds.map(id=>map[id]).filter(Boolean);
  if(next.length===group.items.length) group.items = next;
  saveState(); renderAll();
}
function reorderDayGroups(day, orderedIds){
  const map={}; day.groups.forEach(g=>map[g.id]=g);
  const next = orderedIds.map(id=>map[id]).filter(Boolean);
  if(next.length===day.groups.length) day.groups = next;
  saveState(); renderAll();
}
function duplicateExercise(day, group, it){
  const idx = group.items.findIndex(x=>x.id===it.id);
  const clone = JSON.parse(JSON.stringify(it));
  clone.id = uid('ex');
  group.items.splice(idx+1, 0, clone);
  saveState(); renderAll();
  showToast('Esercizio duplicato');
}
function duplicateGroup(day, group){
  const clone = { id:uid('g'), note:group.note, pyramid:group.pyramid, items: group.items.map(it=>{
    const c = JSON.parse(JSON.stringify(it)); c.id = uid('ex'); return c;
  }) };
  const idx = day.groups.findIndex(g=>g.id===group.id);
  day.groups.splice(idx+1, 0, clone);
  saveState(); renderAll();
  showToast('Gruppo duplicato');
}
function deleteGroup(day, group){
  if(!confirm(`Eliminare il gruppo "${group.note||'senza titolo'}" e tutti i suoi ${group.items.length} esercizi?`)) return;
  group.items.forEach(it=>{
    delete state.weights[it.id]; delete state.notes[it.id]; delete state.rpe[it.id];
    delete state.actualSets[it.id]; delete state.actualReps[it.id];
  });
  day.groups = day.groups.filter(g=>g.id!==group.id);
  saveState(); renderAll();
  showToast('Gruppo eliminato');
}

/* =========================================================
   DRAG & DROP RIORDINO (tocco/mouse tramite maniglia)
   ========================================================= */
function wireDragHandle(handleEl, itemEl, containerEl, itemClass, onReorder){
  handleEl.addEventListener('pointerdown', e=>{
    if(e.button!==undefined && e.button!==0) return;
    e.preventDefault();
    const rect = itemEl.getBoundingClientRect();
    const startTop = rect.top, startLeft = rect.left, w = rect.width, h = rect.height;
    const startClientY = e.clientY;

    const placeholder = document.createElement('div');
    placeholder.className = 'drag-placeholder';
    placeholder.style.height = h+'px';
    itemEl.after(placeholder);

    itemEl.classList.add('dragging-item');
    itemEl.style.width = w+'px';
    itemEl.style.left = startLeft+'px';
    itemEl.style.top = startTop+'px';
    document.body.classList.add('dragging-active');

    function itemSiblings(){
      return Array.from(containerEl.children).filter(el=>el!==itemEl && el!==placeholder && el.classList.contains(itemClass));
    }

    function onMove(ev){
      const dy = ev.clientY - startClientY;
      const newTop = startTop+dy;
      itemEl.style.top = newTop+'px';
      const midY = newTop + h/2;
      const sibs = itemSiblings();
      let placedBefore=null;
      for(const sib of sibs){
        const r = sib.getBoundingClientRect();
        if(midY < r.top + r.height/2){ placedBefore=sib; break; }
      }
      if(placedBefore) containerEl.insertBefore(placeholder, placedBefore);
      else if(sibs.length) containerEl.insertBefore(placeholder, sibs[sibs.length-1].nextSibling);
      else containerEl.appendChild(placeholder);
    }
    function onUp(){
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      placeholder.replaceWith(itemEl);
      itemEl.classList.remove('dragging-item');
      itemEl.style.width=''; itemEl.style.left=''; itemEl.style.top='';
      document.body.classList.remove('dragging-active');
      const newOrder = Array.from(containerEl.children).filter(el=>el.classList.contains(itemClass)).map(el=>el.dataset.dragid);
      onReorder(newOrder);
    }
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp, {once:true});
  });
}

function openModal({title, fields, confirmLabel, onConfirm}){
  const overlay=document.getElementById('overlay');
  const modal=document.getElementById('modal');
  modal.innerHTML = `<h3>${title}</h3>` +
    fields.map((f,i)=>{
      if(f.type==='choice'){
        return `<label>${f.label}</label><div class="choice-row" id="mf_${i}">` +
          f.options.map(o=>`<button type="button" class="choice-btn${o.value===f.value?' active':''}" data-val="${o.value}">${o.label}</button>`).join('') +
          `</div>`;
      }
      if(f.type==='color'){
        return `<label>${f.label}</label><div class="color-row" id="mf_${i}">` +
          f.options.map(hex=>`<button type="button" class="color-swatch${hex===f.value?' active':''}" data-val="${hex}" style="background:${hex};" aria-label="${hex}"></button>`).join('') +
          `</div>`;
      }
      return `<label>${f.label}</label><input type="text" inputmode="${f.inputmode||'text'}" id="mf_${i}" value="${f.value!==undefined?f.value:''}" placeholder="${f.placeholder||''}">`;
    }).join('') +
    `<div class="btn-row"><button class="btn-cancel" id="modalCancel">Annulla</button><button class="btn-confirm" id="modalOk">${confirmLabel||'Conferma'}</button></div>`;
  overlay.classList.add('show');
  const close=()=>overlay.classList.remove('show');
  document.getElementById('modalCancel').onclick=close;
  fields.forEach((f,i)=>{
    if(f.type==='choice' || f.type==='color'){
      const row=document.getElementById('mf_'+i);
      row.dataset.selected = f.value || f.options[0].value;
      const btnSel = f.type==='color' ? '.color-swatch' : '.choice-btn';
      row.querySelectorAll(btnSel).forEach(btn=>{
        btn.addEventListener('click', ()=>{
          row.dataset.selected = btn.dataset.val;
          row.querySelectorAll(btnSel).forEach(b=>b.classList.toggle('active', b===btn));
        });
      });
    }
  });
  document.getElementById('modalOk').onclick=()=>{
    const values = fields.map((f,i)=> (f.type==='choice' || f.type==='color')
      ? document.getElementById('mf_'+i).dataset.selected
      : document.getElementById('mf_'+i).value.trim());
    close();
    onConfirm(values);
  };
  setTimeout(()=>{ const first=modal.querySelector('input'); if(first) first.focus(); }, 60);
}

/* =========================================================
   WIZARD NUOVO ESERCIZIO (categoria → sottotipo → form dedicato)
   ========================================================= */
const CATEGORY_DEFS = [
  { val:'weight',     ic:'🏋️', h:'Con i pesi',    s:'Manubri, bilanciere, macchine' },
  { val:'bodyweight', ic:'🤸', h:'Corpo libero',  s:'Nessun sovraccarico esterno' },
  { val:'cardio',     ic:'🏃', h:'Cardio',        s:'Cyclette, corda, tapis roulant...' }
];
const WEIGHTMODE_DEFS = [
  { val:'fixed',   ic:'📊', h:'Serie e pesi fissi', s:'Numero di serie e ripetizioni definito' },
  { val:'pyramid', ic:'⛰️', h:'Piramidale',        s:'Ripetizioni decrescenti, peso crescente' },
  { val:'failure', ic:'🔥', h:'A cedimento',       s:'Ripetizioni portate a esaurimento' }
];
function parseSchemeToSteps(scheme){
  const nums = (scheme||'').match(/\d+/g);
  if(!nums || !nums.length) return [12,10,8];
  const uniq = [];
  nums.forEach(n=>{ const v=parseInt(n); if(uniq[uniq.length-1]!==v) uniq.push(v); });
  return uniq.slice(0,6);
}

function openExerciseWizard({ day, group, groupTitle, initial, onDone }){
  const overlay=document.getElementById('overlay');
  const modal=document.getElementById('modal');

  function guessStart(){
    if(!initial) return { step:'category', category:null, weightMode:null };
    const t = initial.type || 'weight';
    if(t==='cardio') return { step:'form', category:'cardio', weightMode:null };
    if(t==='bodyweight') return { step:'form', category:'bodyweight', weightMode:null };
    let wm = 'fixed';
    if(group && group.pyramid) wm='pyramid';
    else if(initial.repsMode==='failure') wm='failure';
    return { step:'form', category:'weight', weightMode:wm };
  }
  const ws = guessStart();

  function crumb(){
    const parts=[];
    if(ws.category) parts.push(CATEGORY_DEFS.find(c=>c.val===ws.category).h);
    if(ws.weightMode) parts.push(WEIGHTMODE_DEFS.find(w=>w.val===ws.weightMode).h);
    return parts.join(' · ');
  }
  function head(showBack, title){
    return `<div class="wizard-head">
      ${showBack?`<button type="button" class="wizard-back" id="wizBack">‹</button>`:''}
      <div class="wizard-titles"><h3>${title}</h3>${crumb()?`<div class="wizard-crumb">${crumb()}</div>`:''}</div>
    </div>`;
  }
  function tilesHtml(defs, attr){
    return `<div class="type-grid">${defs.map(d=>`
      <button type="button" class="type-tile" data-${attr}="${d.val}">
        <span class="ic">${d.ic}</span>
        <span class="tt"><span class="h">${d.h}</span><span class="s">${d.s}</span></span>
        <span class="arrow">›</span>
      </button>`).join('')}</div>`;
  }

  function draw(){
    overlay.classList.add('show');
    if(ws.step==='category') drawCategory();
    else if(ws.step==='submode') drawSubmode();
    else drawForm();
  }

  function drawCategory(){
    modal.innerHTML = head(false, initial ? 'Cambia tipo esercizio' : 'Che tipo di esercizio?') +
      tilesHtml(CATEGORY_DEFS, 'cat') +
      `<div class="btn-row"><button class="btn-cancel" id="wizCancel">Annulla</button></div>`;
    modal.querySelectorAll('[data-cat]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        ws.category = btn.dataset.cat;
        ws.step = (ws.category==='weight') ? 'submode' : 'form';
        draw();
      });
    });
    document.getElementById('wizCancel').onclick = ()=>overlay.classList.remove('show');
  }

  function drawSubmode(){
    modal.innerHTML = head(true, 'Che tipo di allenamento?') + tilesHtml(WEIGHTMODE_DEFS, 'wm');
    document.getElementById('wizBack').onclick = ()=>{ ws.step='category'; ws.category=null; ws.weightMode=null; draw(); };
    modal.querySelectorAll('[data-wm]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        ws.weightMode = btn.dataset.wm;
        ws.step='form';
        draw();
      });
    });
  }

  function backFromForm(){
    if(ws.category==='weight'){ ws.step='submode'; ws.weightMode=null; }
    else { ws.step='category'; ws.category=null; }
    draw();
  }

  function baseFields(){
    return { name:undefined, type:undefined, setsMode:undefined, setsCount:undefined,
      repsMode:undefined, repsCount:undefined, weightMode:undefined, rest:undefined,
      durationMin:undefined, scheme:undefined, detail:undefined, pyramidSteps:undefined };
  }

  function finalize(itemData, wantsPyramid){
    overlay.classList.remove('show');
    let movedToNewGroup=false;
    if(initial && group){
      if(!!group.pyramid === wantsPyramid){
        Object.assign(initial, itemData);
      } else {
        group.items = group.items.filter(x=>x.id!==initial.id);
        if(group.items.length===0) day.groups = day.groups.filter(g=>g.id!==group.id);
        const newItem = Object.assign({ id:initial.id, choice:initial.choice }, itemData);
        day.groups.push({ id:uid('g'), pyramid:wantsPyramid, items:[newItem] });
        movedToNewGroup=true;
      }
    } else if(group){
      if(!!group.pyramid === wantsPyramid){
        group.items.push(Object.assign({ id:uid('ex'), choice:false }, itemData));
      } else {
        day.groups.push({ id:uid('g'), pyramid:wantsPyramid, items:[Object.assign({ id:uid('ex'), choice:false }, itemData)] });
        movedToNewGroup=true;
      }
    } else {
      day.groups.push({ id:uid('g'), note:groupTitle, pyramid:wantsPyramid, items:[Object.assign({ id:uid('ex'), choice:false }, itemData)] });
    }
    saveState();
    if(onDone) onDone({ movedToNewGroup });
  }

  function wireSaveCancel(onSave){
    document.getElementById('wizBack').onclick = backFromForm;
    document.getElementById('wizCancel').onclick = ()=>overlay.classList.remove('show');
    document.getElementById('wizSave').onclick = onSave;
    setTimeout(()=>{ const first=modal.querySelector('input'); if(first) first.focus(); }, 60);
  }

  function drawForm(){
    if(ws.category==='cardio') return drawCardioForm();
    if(ws.category==='bodyweight') return drawSetsForm({ title:'Corpo libero', weightType:false });
    if(ws.category==='weight' && ws.weightMode==='fixed') return drawSetsForm({ title:'Serie e pesi fissi', weightType:true });
    if(ws.category==='weight' && ws.weightMode==='failure') return drawFailureForm();
    if(ws.category==='weight' && ws.weightMode==='pyramid') return drawPyramidForm();
  }

  function drawCardioForm(){
    const name = initial?.name || '';
    const duration = initial?.durationMin || (initial?.scheme ? (parseInt(initial.scheme)||'') : '');
    modal.innerHTML = head(true, 'Esercizio cardio') + `
      <label>Nome esercizio</label>
      <input type="text" id="wf_name" value="${name}" placeholder="Es. Cyclette">
      <label>Durata (minuti)</label>
      <input type="text" inputmode="numeric" id="wf_duration" value="${duration}" placeholder="15">
      <div class="btn-row"><button class="btn-cancel" id="wizCancel">Annulla</button><button class="btn-confirm" id="wizSave">Salva</button></div>
    `;
    wireSaveCancel(()=>{
      const nm = document.getElementById('wf_name').value.trim() || 'Nuovo esercizio';
      const dur = parseInt(document.getElementById('wf_duration').value) || 0;
      finalize(Object.assign(baseFields(), {
        name:nm, type:'cardio', durationMin:dur, scheme: dur ? `${dur} min` : ''
      }), false);
    });
  }

  function drawSetsForm({ title, weightType }){
    const name = initial?.name || '';
    const sets = initial?.setsCount || 3;
    const reps = initial?.repsCount || 10;
    const rest = initial?.rest || '';
    modal.innerHTML = head(true, title) + `
      <label>Nome esercizio</label>
      <input type="text" id="wf_name" value="${name}" placeholder="Es. ${weightType?'Panca piana':'Piegamenti'}">
      <label>Serie</label>
      <input type="text" inputmode="numeric" id="wf_sets" value="${sets}" placeholder="3">
      <label>Ripetizioni</label>
      <input type="text" inputmode="numeric" id="wf_reps" value="${reps}" placeholder="10">
      <label>Recupero tra le serie (secondi)</label>
      <input type="text" inputmode="numeric" id="wf_rest" value="${rest}" placeholder="75">
      <div class="btn-row"><button class="btn-cancel" id="wizCancel">Annulla</button><button class="btn-confirm" id="wizSave">Salva</button></div>
    `;
    wireSaveCancel(()=>{
      const nm = document.getElementById('wf_name').value.trim() || 'Nuovo esercizio';
      const setsCount = parseInt(document.getElementById('wf_sets').value) || 3;
      const repsCount = parseInt(document.getElementById('wf_reps').value) || 10;
      const restRaw = document.getElementById('wf_rest').value.trim();
      const rest = (restRaw!=='' && !isNaN(parseInt(restRaw))) ? parseInt(restRaw) : undefined;
      finalize(Object.assign(baseFields(), {
        name:nm, type: weightType?'weight':'bodyweight',
        setsMode:'fixed', setsCount, repsMode:'fixed', repsCount,
        weightMode: weightType?'fixed':undefined, rest
      }), false);
    });
  }

  function drawFailureForm(){
    const name = initial?.name || '';
    const sets = initial?.setsCount || 3;
    const rest = initial?.rest || '';
    modal.innerHTML = head(true, 'A cedimento') + `
      <label>Nome esercizio</label>
      <input type="text" id="wf_name" value="${name}" placeholder="Es. Push-up">
      <label>Serie</label>
      <input type="text" inputmode="numeric" id="wf_sets" value="${sets}" placeholder="3">
      <label>Recupero tra le serie (secondi)</label>
      <input type="text" inputmode="numeric" id="wf_rest" value="${rest}" placeholder="90">
      <div class="wizard-hint">Le ripetizioni sono "a cedimento": durante l'allenamento potrai registrare quante ne hai fatte davvero.</div>
      <div class="btn-row"><button class="btn-cancel" id="wizCancel">Annulla</button><button class="btn-confirm" id="wizSave">Salva</button></div>
    `;
    wireSaveCancel(()=>{
      const nm = document.getElementById('wf_name').value.trim() || 'Nuovo esercizio';
      const setsCount = parseInt(document.getElementById('wf_sets').value) || 3;
      const restRaw = document.getElementById('wf_rest').value.trim();
      const rest = (restRaw!=='' && !isNaN(parseInt(restRaw))) ? parseInt(restRaw) : undefined;
      finalize(Object.assign(baseFields(), {
        name:nm, type:'weight', setsMode:'fixed', setsCount, repsMode:'failure', weightMode:'fixed', rest
      }), false);
    });
  }

  function drawPyramidForm(){
    let name = initial?.name || '';
    let steps = (initial && initial.pyramidSteps && initial.pyramidSteps.length)
      ? initial.pyramidSteps.map(s=>s.reps)
      : (initial && initial.scheme ? parseSchemeToSteps(initial.scheme) : [12,10,8]);
    let rest = initial?.rest || 120;
    let note = initial?.detail || '';

    function syncFromDom(){
      const n=document.getElementById('wf_name'); if(n) name=n.value;
      const r=document.getElementById('wf_rest'); if(r) rest=r.value;
      const nt=document.getElementById('wf_note'); if(nt) note=nt.value;
      const stepInputs=document.querySelectorAll('#wf_steps input');
      if(stepInputs.length) steps=Array.from(stepInputs).map(inp=>parseInt(inp.value)||0);
    }
    function stepsHtml(){
      return steps.map((r,i)=>`
        <div class="pyramid-step">
          <span class="badge-num">${i+1}</span>
          <span class="step-lbl">rip.</span>
          <input type="text" inputmode="numeric" value="${r}">
          <button type="button" class="rm" data-rmstep="${i}" ${steps.length<=1?'disabled':''}>✕</button>
        </div>`).join('');
    }
    function drawInner(){
      modal.innerHTML = head(true, 'Componi il piramidale') + `
        <label>Nome esercizio</label>
        <input type="text" id="wf_name" value="${name}" placeholder="Es. Bench Press">
        <label>Gradini (ripetizioni per serie, in ordine)</label>
        <div class="pyramid-steps" id="wf_steps">${stepsHtml()}</div>
        <button type="button" class="add-step-btn" id="wf_addstep">+ Aggiungi gradino</button>
        <label>Recupero tra le serie (secondi)</label>
        <input type="text" inputmode="numeric" id="wf_rest" value="${rest}">
        <label>Nota (facoltativa)</label>
        <input type="text" id="wf_note" value="${note}" placeholder="Es. Aumenta il peso ad ogni gradino">
        <div class="btn-row"><button class="btn-cancel" id="wizCancel">Annulla</button><button class="btn-confirm" id="wizSave">Salva</button></div>
      `;
      document.getElementById('wizBack').onclick = backFromForm;
      document.getElementById('wizCancel').onclick = ()=>overlay.classList.remove('show');
      document.getElementById('wf_addstep').onclick = ()=>{
        syncFromDom();
        const last = steps[steps.length-1] || 10;
        steps.push(Math.max(1, last-2));
        drawInner();
      };
      modal.querySelectorAll('[data-rmstep]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          syncFromDom();
          steps.splice(parseInt(btn.dataset.rmstep), 1);
          drawInner();
        });
      });
      document.getElementById('wizSave').onclick = ()=>{
        syncFromDom();
        const finalSteps = (steps.filter(v=>v>0).length ? steps.filter(v=>v>0) : [12,10,8]).map(r=>({reps:r}));
        const restVal = (rest!=='' && !isNaN(parseInt(rest))) ? parseInt(rest) : 120;
        const nm = (name||'').trim() || 'Nuovo esercizio';
        const noteVal = (note||'').trim() || 'Aumenta il peso ad ogni gradino, riducendo le ripetizioni.';
        finalize(Object.assign(baseFields(), {
          name:nm, type:'weight', pyramidSteps:finalSteps,
          scheme: finalSteps.map(s=>s.reps).join(' · '),
          detail: noteVal, rest: restVal
        }), true);
      };
      setTimeout(()=>{ const first=modal.querySelector('input'); if(first) first.focus(); }, 60);
    }
    drawInner();
  }

  draw();
}

function openSchedeManager(){
  const overlay=document.getElementById('overlay');
  const modal=document.getElementById('modal');

  function draw(){
    modal.innerHTML = `<h3>Le tue schede</h3>` +
      state.schede.map((s,i)=>`
        <div class="manage-row">
          <button class="reorder-btn" data-mv="${s.id}" data-dir="-1" ${i===0?'disabled':''}>▲</button>
          <button class="reorder-btn" data-mv="${s.id}" data-dir="1" ${i===state.schede.length-1?'disabled':''}>▼</button>
          <button class="color-dot" data-cl="${s.id}" style="background:${resolveSchedaHex(s.color)};" aria-label="Cambia colore"></button>
          <span class="manage-name" data-rn="${s.id}">${s.name}</span>
          <button class="mini-btn danger" data-del="${s.id}">Elimina</button>
        </div>`).join('') +
      `<button class="new-group-btn" id="createSchedaBtn" style="margin-top:16px;">+ Crea nuova scheda</button>
       <div class="btn-row"><button class="btn-confirm" id="manageDone">Fatto</button></div>`;

    modal.querySelectorAll('[data-mv]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const idx=state.schede.findIndex(x=>x.id===btn.dataset.mv);
        const newIdx=idx+parseInt(btn.dataset.dir);
        if(newIdx<0||newIdx>=state.schede.length) return;
        const tmp=state.schede[idx]; state.schede[idx]=state.schede[newIdx]; state.schede[newIdx]=tmp;
        saveState(); draw();
      });
    });
    modal.querySelectorAll('[data-cl]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const s=state.schede.find(x=>x.id===btn.dataset.cl);
        openModal({ title:'Colore scheda', fields:[{label:'Scegli un colore', type:'color', value:resolveSchedaHex(s.color), options:COLOR_PALETTE}],
          onConfirm:([hex])=>{
            s.color=hex; saveState();
            if(state.currentScheda===s.id) renderTheme(s);
            openSchedeManager();
          } });
      });
    });
    modal.querySelectorAll('[data-rn]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const s=state.schede.find(x=>x.id===el.dataset.rn);
        openModal({ title:'Rinomina scheda', fields:[{label:'Nome scheda', value:s.name}],
          onConfirm:([n])=>{ if(n){ s.name=n; saveState(); } openSchedeManager(); } });
      });
    });
    modal.querySelectorAll('[data-del]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(state.schede.length<=1){ showToast('Deve rimanere almeno una scheda'); return; }
        const s=state.schede.find(x=>x.id===btn.dataset.del);
        const doDelete=()=>{
          state.days=state.days.filter(d=>!s.dayIds.includes(d.id));
          state.schede=state.schede.filter(x=>x.id!==s.id);
          if(state.currentScheda===s.id) state.currentScheda=state.schede[0].id;
          ensureCurrentDayValid(); saveState();
          draw();
        };
        if(schedaHasData(s)){
          if(confirm(`"${s.name}" contiene pesi registrati nei suoi giorni. Eliminare comunque la scheda e tutti i suoi dati?`)) doDelete();
        } else doDelete();
      });
    });
    document.getElementById('createSchedaBtn').addEventListener('click', ()=>{
      openModal({ title:'Nuova scheda', fields:[
        {label:'Nome scheda', placeholder:'Es. Massa, Definizione...'},
        {label:'Colore', type:'color', value:nextPaletteColor(), options:COLOR_PALETTE}
      ], onConfirm:([name, color])=>{
          const schedaName = name || 'Nuova scheda';
          const ns={ id:uid('s'), name:schedaName, color, dayIds:[] };
          state.schede.push(ns);
          state.currentScheda=ns.id;
          ensureCurrentDayValid(); saveState();
          openSchedeManager();
          showToast('Scheda creata: aggiungi un giorno per iniziare');
        }});
    });
    document.getElementById('manageDone').addEventListener('click', ()=>{ overlay.classList.remove('show'); renderAll(); });
  }
  draw();
  overlay.classList.add('show');
}

/* =========================================================
   RENDER — INTESTAZIONE CON SWIPE DELLE SCHEDE
   ========================================================= */
function renderHeaderSwipe(){
  const track = document.getElementById('headerSwipeTrack');
  const dotsWrap = document.getElementById('schedaDots');
  const activeIdx = state.schede.findIndex(s=>s.id===state.currentScheda);

  track.innerHTML = state.schede.map((s,i)=>{
    const hex = resolveSchedaHex(s.color);
    return `<div class="header-page" data-idx="${i}">
      <div class="eyebrow">La tua scheda, settimana dopo settimana</div>
      <h1>Scheda <span style="color:${hex};">${s.name}</span></h1>
    </div>`;
  }).join('');

  dotsWrap.innerHTML = state.schede.map((_,i)=>`<div class="scheda-dot${i===activeIdx?' active':''}"></div>`).join('');
  document.getElementById('manageSchedeLink').style.display = editMode ? 'block' : 'none';

  requestAnimationFrame(()=>{ track.scrollLeft = Math.max(0,activeIdx) * track.clientWidth; });

  if(!track.dataset.dragWired){
    track.dataset.dragWired = '1';
    let isDown=false, startX=0, startScroll=0, moved=false;
    track.addEventListener('mousedown', e=>{
      isDown=true; moved=false;
      startX = e.pageX; startScroll = track.scrollLeft;
      track.classList.add('dragging');
    });
    const endDrag=()=>{ if(!isDown) return; isDown=false; track.classList.remove('dragging'); };
    window.addEventListener('mouseup', endDrag);
    window.addEventListener('mouseleave', endDrag);
    track.addEventListener('mousemove', e=>{
      if(!isDown) return;
      e.preventDefault();
      const dx = e.pageX - startX;
      if(Math.abs(dx) > 4) moved = true;
      track.scrollLeft = startScroll - dx;
    });
    track.addEventListener('click', e=>{
      if(moved){ e.preventDefault(); e.stopPropagation(); moved=false; }
    }, true);
  }

  let scrollTimeout, dotsHideTimeout;
  track.addEventListener('scroll', ()=>{
    dotsWrap.classList.add('visible');
    clearTimeout(dotsHideTimeout);
    dotsHideTimeout = setTimeout(()=>{ dotsWrap.classList.remove('visible'); }, 900);

    clearTimeout(scrollTimeout);
    scrollTimeout = setTimeout(()=>{
      const cardW = track.clientWidth;
      const idx = Math.round(track.scrollLeft / cardW);
      const target = state.schede[idx];
      if(target && target.id !== state.currentScheda){
        state.currentScheda = target.id;
        ensureCurrentDayValid();
        saveState();
        dotsWrap.querySelectorAll('.scheda-dot').forEach((d,i)=>d.classList.toggle('active', i===idx));
        renderDayTabs(); renderWeekStrip(); renderExercises();
        renderTheme(target);
      }
    }, 100);
  });
}

      const fields = [

      }
      openModal({
        title:`Nuovo giorno — solo S${state.currentWeek}`,

        onConfirm:([num, name, choice])=>{
          const title = name || 'Nuovo giorno';
          const newDay = { id:uid('d'), num: num||('Giorno '+(currentIds.length+1)), focus:title, groups:[] };
          const sourceDay = choice && choice!=='scratch' ? state.days.find(d=>d.id===choice) : null;
          if(sourceDay){

            if(sourceDay.desc) newDay.desc = sourceDay.desc;

        } else { deleteWeek(w); renderAll(); }

    const add=document.createElement('div');

      openModal({ title:'Nuova settimana', fields:[
        {label:'Contenuto', type:'choice', value:'scratch', options:[
          {value:'scratch', label:'Da zero'},
          {value:'copy', label:`Copia S${prevWeek}`}
        ]}
      ], onConfirm:([choice])=>{
        const newWeek = prevWeek+1;
        state.weeksCount = newWeek;
        state.currentWeek = newWeek;
        if(choice==='copy'){
          allExerciseIds().forEach(id=>{
            const w = state.weights[id];
            if(w && w[String(prevWeek)]!==undefined){
              if(!state.weights[id]) state.weights[id]={};
              state.weights[id][String(newWeek)] = w[String(prevWeek)];
            }
          });
          state.schede.forEach(s=>{
            if(s.weekDayIds && s.weekDayIds[prevWeek]){
              if(!s.weekDayIds) s.weekDayIds={};
              s.weekDayIds[newWeek] = s.weekDayIds[prevWeek].slice();
            }
          });
          state.days.forEach(d=>{
            if(d.weekMeta && d.weekMeta[prevWeek]){
              if(!d.weekMeta) d.weekMeta={};
              d.weekMeta[newWeek] = Object.assign({}, d.weekMeta[prevWeek]);
            }
          });
        }
        saveState(); renderAll();
        showToast(choice==='copy' ? `Settimana creata copiando S${prevWeek}` : 'Nuova settimana creata');
      }});
    });
    wrap.appendChild(add);
  }
}

/* =========================================================
   COMMIT PESO (condiviso tra input manuale e chip "consigliato")
   ========================================================= */
function commitWeight(exId, rawValue){
  const ex=findExercise(exId);
  const exType = ex.type || 'weight';
  const unit = exType==='cardio' ? 'min' : 'kg';
  const prevMax = maxWeight(exId, state.currentWeek);
  setWeightRaw(exId, state.currentWeek, rawValue);
  const parsed = parseNum(rawValue);
  if(!isNaN(parsed) && exType==='weight'){
    if(prevMax!==undefined && parsed>prevMax){
      confettiBurst();
      showToast(`🏆 Nuovo record: ${ex.name} — ${fmt(parsed)}${unit}!`, 'pr');
    } else if(prevMax===undefined){
      showToast(`Primo carico registrato per ${ex.name} 👍`);
    }
  }
  renderAll();
}
function commitSerieWeight(exId, week, idx, rawValue){
  const ex=findExercise(exId);
  const prevMax = maxWeight(exId, week);
  if(!state.weights[exId]) state.weights[exId]={};
  const key=String(week);
  if(!Array.isArray(state.weights[exId][key])) state.weights[exId][key]=[];
  const n = parseNum(rawValue);
  if(rawValue==='' || isNaN(n)) state.weights[exId][key][idx] = null;
  else state.weights[exId][key][idx] = n;
  saveState();
  if(!isNaN(n)){
    if(prevMax!==undefined && n>prevMax){
      confettiBurst();
      showToast(`🏆 Nuovo record: ${ex.name} — ${fmt(n)}kg!`, 'pr');
    } else if(prevMax===undefined){
      showToast(`Primo carico registrato per ${ex.name} 👍`);
    }
  }
  renderAll();
}

          <button class="stepper-btn" data-stepper="reps" data-stepex="${it.id}" data-dir="-1">−</button>
          <span class="stepper-val" data-stepperval="reps:${it.id}">${getActualReps(it.id,state.currentWeek) || 0}</span>
          <button class="stepper-btn" data-stepper="reps" data-stepex="${it.id}" data-dir="1">+</button>
        </div>` : '';

      const rpeHtml = `
        <div class="rpe-row${rpeVal===undefined?' inactive':''}">
          <div class="rpe-top">
            <span class="rpe-label">Sforzo percepito</span>
            <span class="rpe-value" data-rpeval="${it.id}">${rpeVal!==undefined?(fmt(rpeVal)+' · '+rpeLabel(rpeVal)):'Non impostato'}</span>
          </div>
          <div class="rpe-bars" data-rpe="${it.id}">${buildRpeBarsHtml(rpeVal)}</div>
        </div>`;

      if(group.pyramid){
        card.innerHTML = `<div class="ex-top">${infoHtml}${fieldHtml}</div>${rpeHtml}<div class="pyramid-detail">${it.detail}</div>`;
      } else {
        card.innerHTML = `<div class="ex-main">${infoHtml}${fieldHtml}</div>${serieRowsHtml}${setsStepperHtml}${repsStepperHtml}${rpeHtml}`;
      }

      if(editMode){
        const editRow=document.createElement('div');
        editRow.className='edit-row';
        const dragHandle=document.createElement('button');
        dragHandle.type='button'; dragHandle.className='drag-handle'; dragHandle.title='Trascina per riordinare';
        dragHandle.textContent='⠿';
        const dupBtn=document.createElement('button');
        dupBtn.className='mini-btn'; dupBtn.textContent='⧉ duplica';
        dupBtn.addEventListener('click', ()=>duplicateExercise(day, group, it));
        const editSchemeBtn=document.createElement('button');
        editSchemeBtn.className='mini-btn'; editSchemeBtn.textContent='✎ modifica';
        editSchemeBtn.addEventListener('click', ()=>{
          openExerciseWizard({ day, group, initial: it, onDone:(res)=>{
            renderAll();
            showToast(res && res.movedToNewGroup ? 'Esercizio aggiornato e spostato in un nuovo gruppo' : 'Esercizio aggiornato');
          } });
        });
        const delBtn=document.createElement('button');
        delBtn.className='mini-btn danger'; delBtn.textContent='🗑 elimina';
        delBtn.addEventListener('click', ()=>{
          if(confirm(`Eliminare "${it.name}"?`)){
            group.items = group.items.filter(x=>x.id!==it.id);
            delete state.weights[it.id]; delete state.notes[it.id]; delete state.rpe[it.id];
            delete state.actualSets[it.id]; delete state.actualReps[it.id];
            if(group.items.length===0){
              day.groups = day.groups.filter(g=>g.id!==group.id);
            }
            saveState(); renderAll();
          }
        });
        editRow.appendChild(dragHandle); editRow.appendChild(dupBtn);
        editRow.appendChild(editSchemeBtn); editRow.appendChild(delBtn);
        card.appendChild(editRow);
        wireDragHandle(dragHandle, card, gEl, group.pyramid?'pyramid-card':'ex-card', (orderedIds)=>reorderGroupItems(group, orderedIds));
      }
      gEl.appendChild(card);
    });

    if(editMode){
      const addBtn=document.createElement('button');
      addBtn.className='add-ex-btn';
      addBtn.setAttribute('aria-label','Aggiungi esercizio');
      addBtn.textContent='+';
      addBtn.addEventListener('click', ()=>{
        openExerciseWizard({ day, group, initial:null, onDone:(res)=>{
          renderAll();
          showToast(res && res.movedToNewGroup ? 'Esercizio piramidale aggiunto in un nuovo gruppo' : 'Esercizio aggiunto');
        } });
      });
      gEl.appendChild(addBtn);
    }
    main.appendChild(gEl);
  });

  if(editMode){
    const newGroupBtn=document.createElement('button');
    newGroupBtn.className='new-group-btn';
    newGroupBtn.textContent='Nuovo gruppo';
    newGroupBtn.addEventListener('click', ()=>{
      openModal({ title:'Nuovo gruppo', fields:[{label:'Titolo (es. "Petto")', placeholder:'Titolo gruppo'}],
        onConfirm:([title])=>{
          const groupTitle = title || 'Nuovo gruppo';
          openExerciseWizard({ day, group:null, groupTitle, initial:null, onDone:()=>{
            renderAll();
            showToast('Gruppo creato');
          } });
        }});
    });
    main.appendChild(newGroupBtn);
  }

  if(day.groups.length===0 && !editMode){
    main.innerHTML += `<div class="empty-state">Nessun esercizio qui ancora.<br>Attiva la modalità modifica (✎) per aggiungerne.</div>`;
  }

  main.querySelectorAll('input[data-ex]').forEach(input=>{
    input.addEventListener('change', e=>{ commitWeight(e.target.dataset.ex, e.target.value); });
  });
  main.querySelectorAll('input[data-serieex]').forEach(input=>{
    input.addEventListener('change', e=>{
      commitSerieWeight(e.target.dataset.serieex, state.currentWeek, parseInt(e.target.dataset.serieidx), e.target.value);
    });
  });
  main.querySelectorAll('[data-addserie]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const exId=btn.dataset.addserie;
      if(!state.weights[exId]) state.weights[exId]={};
      const key=String(state.currentWeek);
      if(!Array.isArray(state.weights[exId][key])) state.weights[exId][key]=[];
      state.weights[exId][key].push(null);
      saveState(); renderAll();
    });
  });
  main.querySelectorAll('[data-stepper]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const kind=btn.dataset.stepper, exId=btn.dataset.stepex, dir=parseInt(btn.dataset.dir);
      const getter = kind==='sets' ? getActualSets : getActualReps;
      const setter = kind==='sets' ? setActualSets : setActualReps;
      const cur = getter(exId, state.currentWeek) || 0;
      const next = Math.max(0, cur+dir);
      setter(exId, state.currentWeek, next);
      const span = main.querySelector(`[data-stepperval="${kind}:${exId}"]`);
      if(span) span.textContent = next;
    });
  });
  main.querySelectorAll('[data-sugg]').forEach(chip=>{
    chip.addEventListener('click', e=>{ commitWeight(e.currentTarget.dataset.sugg, e.currentTarget.dataset.suggval); });
  });
  main.querySelectorAll('[data-restedit]').forEach(chip=>{
    chip.addEventListener('click', e=>{
      const it=findExercise(e.currentTarget.dataset.restedit);
      openModal({ title:'Recupero tra le serie', fields:[{label:'Secondi (es. 90)', value:it.rest||'', inputmode:'numeric'}],
        onConfirm:([r])=>{
          if(r!=='' && !isNaN(parseInt(r))) it.rest=parseInt(r); else delete it.rest;
          saveState(); renderAll();
        }});
    });
  });
  main.querySelectorAll('.rpe-bars[data-rpe]').forEach(bars=>{
    const exId = bars.dataset.rpe;
    const valSpan = main.querySelector(`.rpe-value[data-rpeval="${exId}"]`);
    const CLEAR_MARGIN = 16;
    function valueFromClientX(clientX){
      const rect = bars.getBoundingClientRect();
      if(clientX < rect.left - CLEAR_MARGIN) return undefined;
      const ratio = Math.min(1, Math.max(0, (clientX-rect.left)/rect.width));
      const v = Math.round((1 + ratio*9)*2)/2;
      return Math.min(10, Math.max(1, v));
    }
    function updateVisual(v){
      bars.innerHTML = buildRpeBarsHtml(v);
      bars.closest('.rpe-row').classList.toggle('inactive', v===undefined);
      if(valSpan) valSpan.textContent = v!==undefined ? (fmt(v) + ' · ' + rpeLabel(v)) : 'Non impostato';
    }
    bars.addEventListener('pointerdown', e=>{
      e.preventDefault();
      updateVisual(valueFromClientX(e.clientX));
      const onMove = ev=>updateVisual(valueFromClientX(ev.clientX));
      const onUp = ev=>{
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        const vFinal = valueFromClientX(ev.clientX);
        updateVisual(vFinal);
        setRPE(exId, state.currentWeek, vFinal);
      };
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    });
  });
  main.querySelectorAll('.ex-note-toggle').forEach(t=>{
    t.addEventListener('click', ()=>{ const box=t.nextElementSibling; box.style.display = box.style.display==='none' ? 'block' : 'none'; });
  });
  main.querySelectorAll('textarea[data-noteinput]').forEach(ta=>{
    ta.addEventListener('change', e=>{
      const exId=e.target.dataset.noteinput;
      if(!state.notes[exId]) state.notes[exId]={};
      state.notes[exId][state.currentWeek]=e.target.value;
      saveState();
    });
  });
  main.querySelectorAll('[data-edit-ex]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const it = findExercise(el.dataset.editEx);
      openModal({ title:'Rinomina esercizio', fields:[{label:'Nome esercizio', value:it.name}],
        onConfirm:([n])=>{ if(n){ it.name=n; saveState(); renderAll(); } } });
    });
  });

}

/* =========================================================
   TROFEI
   ========================================================= */
function activeWeeksSet(s){
  const set=new Set();
  Object.values(s.weights).forEach(byWeek=>{
    Object.keys(byWeek).forEach(wk=>{ if(weekRepValue(byWeek[wk])!==undefined) set.add(Number(wk)); });
  });
  return set;
}
function currentStreak(s){
  const set = activeWeeksSet(s); let streak=0;
  for(let w=s.currentWeek; w>=1; w--){ if(set.has(w)) streak++; else break; }
  return streak;
}
function countPRs(s){
  let count=0;
  Object.values(s.weights).forEach(byWeek=>{
    const weeks = Object.keys(byWeek).map(Number).sort((a,b)=>a-b);
    let max=-Infinity;
    weeks.forEach(w=>{ const v=weekRepValue(byWeek[w]); if(v!==undefined && v>max){ max=v; count++; } });
  });
  return count;
}
function mostImprovedExercise(s){
  let best=null;
  Object.entries(s.weights).forEach(([exId,byWeek])=>{
    const weeks = Object.keys(byWeek).map(Number).sort((a,b)=>a-b).filter(w=>weekRepValue(byWeek[w])!==undefined);
    if(weeks.length<2) return;
    const first=weekRepValue(byWeek[weeks[0]]), last=weekRepValue(byWeek[weeks[weeks.length-1]]);
    if(first<=0) return;
    const pct=((last-first)/first)*100;
    if(!best || pct>best.pct){ const ex=findExercise(exId); if(ex) best={name:ex.name, pct, first, last}; }
  });
  return best;
}
function estimateReps(it){
  if(it.setsMode || it.repsMode){
    const setsN = (it.setsMode==='fixed' && it.setsCount) ? it.setsCount : 3;
    const repsN = (it.repsMode==='fixed' && it.repsCount) ? it.repsCount : 10;
    return setsN*repsN;
  }
  const matches = (it.scheme||'').match(/\d+/g);
  if(matches && matches.length>=2) return parseInt(matches[matches.length-2])*parseInt(matches[matches.length-1]) || 10;
  return 10;
}
function totalKgMoved(s){
  let total=0;
  s.days.forEach(d=>d.groups.forEach(g=>g.items.forEach(it=>{
    const byWeek=s.weights[it.id]; if(!byWeek) return;
    const reps=estimateReps(it);
    Object.values(byWeek).forEach(v=>{
      if(Array.isArray(v)){ v.forEach(n=>{ if(n!==undefined && n!==null) total += n*reps; }); }
      else if(v!==undefined && v!==null){ total += v*reps; }
    });
  })));
  return total;
}
function dayCompletedOnce(s, dayId){
  const day = s.days.find(d=>d.id===dayId); if(!day) return false;
  const allItems = day.groups.flatMap(g=>g.items);
  if(!allItems.length) return false;
  for(let w=1; w<=s.weeksCount; w++){
    if(allItems.every(it => getWeight(it.id, w)!==undefined)) return true;
  }
  return false;
}
function rpeLoggedCount(s){
  let n=0;
  Object.values(s.rpe||{}).forEach(byWeek=>{ n += Object.keys(byWeek).length; });
  return n;
}
function baseExerciseCount(){ return SEED_DAYS.reduce((n,d)=>n+d.groups.reduce((m,g)=>m+g.items.length,0),0); }
function isCustomized(s){
  const currentCount = s.days.reduce((n,d)=>n+d.groups.reduce((m,g)=>m+g.items.length,0),0);
  return currentCount !== baseExerciseCount() || s.days.length !== SEED_DAYS.length;
}

function baseGroupCounts(){
  let cardio=0, pyramid=0;
  SEED_DAYS.forEach(d=>d.groups.forEach(g=>{
    if(g.pyramid) pyramid++;
    g.items.forEach(it=>{ if(it.type==='cardio') cardio++; });
  }));
  return { cardio, pyramid };
}
function noteCount(s){
  let n=0;
  Object.values(s.notes||{}).forEach(byWeek=>{ Object.values(byWeek).forEach(t=>{ if(t && t.trim()) n++; }); });
  return n;
}
function maxRpeEver(s){
  let mx=-Infinity;
  Object.values(s.rpe||{}).forEach(byWeek=>{ Object.values(byWeek).forEach(v=>{ if(v>mx) mx=v; }); });
  return mx;
}
function minRpeEver(s){
  let mn=Infinity;
  Object.values(s.rpe||{}).forEach(byWeek=>{ Object.values(byWeek).forEach(v=>{ if(v<mn) mn=v; }); });
  return mn;
}
